name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install_args: node
      - run: npx --yes prettier@3 --config packages/prettier-config/index.json --check .
      - run: npm pack --dry-run
        working-directory: packages/prettier-config
