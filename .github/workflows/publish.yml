name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
        with:
          install_args: node
      - name: Resolve package from tag
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag%-v*}"
          version="${tag##*-v}"
          dir="packages/${name}"
          test -f "$dir/package.json" || { echo "No package for tag $tag"; exit 1; }
          test "$(node -p "require('./$dir/package.json').version")" = "$version" || { echo "Tag version $version != package.json"; exit 1; }
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - run: npm publish --provenance --access public
        working-directory: ${{ steps.pkg.outputs.dir }}
